<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rota do Ouro Verde</title>
  <meta name="description" content="Conheça a Rota do Ouro Verde: 89 km de natureza, memória do café, hospitalidade local e experiências autênticas na Serra Fluminense." />
  <meta name="keywords" content="Rota do Ouro Verde, trilha Serra Fluminense, Trajano de Moraes, ecoturismo RJ, rota do café, trilha de longo curso, turismo de natureza" />
  <meta name="theme-color" content="#111111" />
  <meta property="og:title" content="Rota do Ouro Verde" />
  <meta property="og:description" content="89 km de natureza, história do café e experiências autênticas na Serra Fluminense." />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="pt_BR" />
  <meta property="og:image" content="assets/hero.webp" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/main.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <link rel="icon" href="../favicon/favicon.ico">
  <link rel="icon" type="image/png" sizes="128x128" href="../favicon/favicon-128x128.png">
  <link rel="icon" type="image/svg+xml" href="../favicon/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="../favicon/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Rota do Ouro Verde">
  <link rel="manifest" href="../favicon/site.webmanifest">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
</head>
<body>
<div id="global-header"></div>
<header class="hero" id="inicio">
        <div class="hero-overlay"></div>
    <div class="hero-content container reveal">
      <div class="breadcrumbs">
        <a href="../index.html">Início</a>
        <span>•</span>
        <span id="route-breadcrumb">Percurso</span>
      </div>
      <span class="eyebrow">Detalhes do percurso</span>
      <h1 id="route-title"></h1>
      <p id="route-subtitle"></p>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container route-summary">
        <div id="route-summary"></div>
        <div class="route-cover reveal" id="route-cover"></div>
      </div>
    </section>

    <section class="section alt" id="etapas">
      <div class="container reveal">
        <div class="section-head">
          <div>
            <p class="section-tag">Etapas</p>
            <h2>Abra cada dia para ver detalhes e fotos</h2>
          </div>
        </div>
        <div class="stage-grid" id="stage-grid">
          <div class="empty-state">Carregando etapas...</div>
        </div>

        <div class="route-links-bottom" id="route-extra-links"></div>
      </div>
    </section>

    <section class="section" id="apoio">
      <div class="container reveal">
        <div id="route-support-section"></div>
      </div>
    </section>
  </main>
<div class="modal" id="stage-modal" aria-hidden="true">
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="stage-title">
      <button class="modal-close" id="stage-close-btn" aria-label="Fechar">✕</button>
      <div class="modal-body">
        <h3 id="stage-title">Etapa</h3>
        <p class="modal-subtitle" id="stage-subtitle"></p>
        <div id="stage-content"></div>
      </div>
    </div>
    <div data-stage-close="true" style="position:absolute;inset:0;z-index:-1"></div>
  </div>

  <div class="modal photo-modal" id="photo-modal" aria-hidden="true">
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="photo-modal-title">
      <button class="modal-close" id="photo-close-btn" aria-label="Fechar">✕</button>
      <div class="modal-body">
        <div class="photo-head">
          <div>
            <h3 id="photo-modal-title">Foto</h3>
            <p id="photo-modal-counter"></p>
          </div>
          <div class="photo-nav">
            <button type="button" id="photo-prev" aria-label="Anterior">←</button>
            <button type="button" id="photo-next" aria-label="Próxima">→</button>
          </div>
        </div>
        <div class="photo-stage">
          <img id="photo-modal-image" alt="Foto ampliada do percurso">
        </div>
        <div class="photo-thumbs" id="photo-modal-thumbs"></div>
      </div>
    </div>
    <div data-photo-close="true" style="position:absolute;inset:0;z-index:-1"></div>
  </div>
  
<div id="global-footer"></div>

<script src="../shared/common.js"></script>
  <script src="percurso.js"></script>
<script type="module" src="../shared/layouts/app.js" data-base="../"></script>
</body>
</html>
